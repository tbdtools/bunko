version: "3"

tasks:
  setup:
    cmds:
      - npm install
      - cd src-tauri && cargo build

  dev:
    cmds:
      - npm run tauri dev

  build:
    cmds:
      - npm run tauri build

  test:
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:e2e

  test:unit:
    cmds:
      - npm test
      - cd src-tauri && cargo test --lib

  test:integration:
    cmds:
      - cd src-tauri && cargo test --test '*'

  test:e2e:
    cmds:
      - lsof -ti:1420 | xargs kill -9 || true
      - pkill -f "tauri dev" || true
      - npm run tauri dev &
      - npx wait-on tcp:1420
      - npm run cypress:run
      - pkill -f "tauri dev"

  lint:
    cmds:
      - npm run lint
      - cd src-tauri && cargo fmt --check

  format:
    cmds:
      - npm run format
      - cd src-tauri && cargo fmt

  ci:
    cmds:
      - task: lint
      - task: test
      - task: build

  release:
    cmds:
      - semantic-release
